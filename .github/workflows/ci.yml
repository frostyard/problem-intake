# CI (core ADR-0021: SHA-pinned actions, least privilege; ADR-0042: merge
# queue). The job ci is the required check: it runs `make ci`, which runs the
# typecheck, the validator drift check, the node tests (privacy scan, config
# and Compose pins), vitest with coverage, and `wrangler deploy --dry-run`.
name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  merge_group: {}

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: npm ci
      - run: make ci BASE="$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          WRANGLER_SEND_METRICS: "false"
