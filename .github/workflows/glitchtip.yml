# GlitchTip runbook proof (docs/runbook/glitchtip.md, plan T857 t15): start
# glitchtip/compose.yaml on the runner, send 2 events of 1 issue in the
# Worker's envelope format (its own builder, src/envelope.ts), find them by
# report_id as event id and check that no tag holds the report_id, delete 1
# with the runbook's script, prove that no table holds its report_id
# (pg_dump), and prove that the other event and the issue stay. Then prove the nightly cleanup with
# scripts/glitchtip-cleanup-proof.sh: it fails with no cleanup, and passes
# with GlitchTip's real nightly task. The reader proof comes between the 2
# parts: a user with a read-only token, 4 more problems, and scripts/triage/read.mjs
# against the test instance, so the scopes of the read token and the facts it
# writes are tested. All secrets are throwaway values made in the job, in the
# env file that compose.ci.yaml points to.
name: GlitchTip runbook

on:
  pull_request:
    paths:
      - "glitchtip/**"
      - "scripts/glitchtip-*"
      - "scripts/triage/**"
      - "triage/**"
      - "test/fixtures/triage/**"
      - "src/envelope.ts"
      - ".github/workflows/glitchtip.yml"
  merge_group: {}
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: glitchtip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  glitchtip-runbook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COMPOSE: docker compose -p glitchtip-ci -f glitchtip/compose.yaml -f glitchtip/compose.ci.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Make the throwaway env file and data folders
        run: |
          set -euo pipefail
          secret_key="$(openssl rand -hex 32)"
          db_password="$(openssl rand -hex 24)"
          echo "::add-mask::$secret_key"
          echo "::add-mask::$db_password"
          data="$(mktemp -d)"
          mkdir -p "$data/postgres" "$data/uploads"
          # The postgres entrypoint, as uid 999, must pass the mount point;
          # GlitchTip runs as uid 5000 and writes uploads.
          chmod 755 "$data/postgres"
          sudo chown 5000:5000 "$data/uploads"
          # The same 6 names as glitchtip/.env.example and the env file on
          # the NAS, mode 0600.
          (
            umask 077
            {
              echo "SECRET_KEY=$secret_key"
              echo "POSTGRES_PASSWORD=$db_password"
              echo "DATABASE_PASSWORD=$db_password"
              echo "GLITCHTIP_DOMAIN=http://localhost:8000"
              echo "ALLOWED_HOSTS=localhost,127.0.0.1"
              echo "DEFAULT_FROM_EMAIL=glitchtip-ci@example.invalid"
            } > "$data/glitchtip.env"
          )
          [[ "$(stat -c %a "$data/glitchtip.env")" == 600 ]] || { echo "the env file is not mode 0600"; exit 1; }
          diff <(sed -n 's/=.*//p' "$data/glitchtip.env" | sort) <(grep -v '^#' glitchtip/.env.example | sed -n 's/=$//p' | sort)
          echo "CI_DATA=$data" >> "$GITHUB_ENV"

      - name: Start the stack
        run: |
          set -euo pipefail
          $COMPOSE config --quiet
          $COMPOSE up -d
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/_health/ >/dev/null 2>&1; then
              echo "web is healthy"
              exit 0
            fi
            sleep 5
          done
          $COMPOSE ps
          $COMPOSE logs --tail 100 migrate web
          exit 1

      - name: Check the published port and the healthcheck
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$($COMPOSE ps -q web)")"
            [[ "$status" == healthy ]] && break
            sleep 5
          done
          [[ "$status" == healthy ]] || { echo "web healthcheck: $status"; exit 1; }
          # Only web publishes a port.
          for service in postgres valkey; do
            ports="$(docker port "$($COMPOSE ps -q "$service")" || true)"
            [[ -z "$ports" ]] || { echo "$service publishes $ports"; exit 1; }
          done

      - name: Check that the scheduler runs inside web
        run: |
          set -euo pipefail
          # web runs the task worker and the scheduler (SERVER_ROLE=all_in_one),
          # and the scheduler holds this key in Valkey while it runs.
          for _ in $(seq 1 30); do
            keys="$($COMPOSE exec -T valkey valkey-cli --scan --pattern '*vtasks_scheduler_lock*' || true)"
            if [[ -n "$keys" ]]; then
              echo "the scheduler holds its lock: $(wc -l <<<"$keys") key(s) match *vtasks_scheduler_lock*"
              exit 0
            fi
            sleep 2
          done
          $COMPOSE logs --tail 100 web
          echo "no vtasks_scheduler_lock key in valkey: the scheduler does not run"
          exit 1

      - name: Create a user, an organization, a project and a token
        run: |
          set -euo pipefail
          out="$($COMPOSE exec -T -e GLITCHTIP_CI=true web ./manage.py shell < scripts/glitchtip-ci-setup.py)"
          dsn="$(sed -n 's/^CI_DSN=//p' <<<"$out")"
          token="$(sed -n 's/^CI_TOKEN=//p' <<<"$out")"
          [[ -n "$dsn" && -n "$token" ]] || { echo "setup gave no DSN or token"; exit 1; }
          echo "::add-mask::$token"
          {
            echo "CI_DSN=$dsn"
            echo "CI_TOKEN=$token"
            # 2 reports with the same fingerprint, so 1 issue: delete the
            # first, and keep the second.
            echo "REPORT_ID=$(node -e 'process.stdout.write(crypto.randomUUID())')"
            echo "KEEP_ID=$(node -e 'process.stdout.write(crypto.randomUUID())')"
          } >> "$GITHUB_ENV"

      - name: Send 2 events of 1 issue in the Worker's envelope format
        run: |
          set -euo pipefail
          node scripts/glitchtip-send-event.mjs "$REPORT_ID"
          node scripts/glitchtip-send-event.mjs "$KEEP_ID"

      - name: Find both events by report_id as event id, in the same issue, with no report_id tag
        run: |
          set -euo pipefail
          # Prints the issue id of the event with this report_id, or fails.
          find_event() {
            local url="http://127.0.0.1:8000/api/0/projects/frostyard/system/events/${1//-/}/"
            local body
            body="$(mktemp)"
            for _ in $(seq 1 60); do
              if curl -fsS -H "Authorization: Bearer $CI_TOKEN" "$url" -o "$body"; then
                # The caller's || turns off set -e here: check the status by hand.
                local rc=0
                REPORT="$1" node -e '
                  const e = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                  const forms = [process.env.REPORT, process.env.REPORT.replaceAll("-", "")];
                  for (const t of e.tags || []) {
                    if (forms.some((f) => String(t.key).includes(f) || String(t.value).includes(f))) {
                      console.error(`tag ${t.key} holds the report_id`);
                      process.exit(1);
                    }
                  }
                  if (e.eventID !== forms[1]) { console.error("the event id is not the report_id"); process.exit(1); }
                  process.stdout.write(String(e.groupID));
                ' "$body" || rc=$?
                rm -f "$body"
                return "$rc"
              fi
              sleep 5
            done
            rm -f "$body"
            echo "the event did not arrive" >&2
            return 1
          }
          issue_a="$(find_event "$REPORT_ID")" || { $COMPOSE logs --tail 100 web; exit 1; }
          issue_b="$(find_event "$KEEP_ID")" || { $COMPOSE logs --tail 100 web; exit 1; }
          [[ "$issue_a" == "$issue_b" ]] || { echo "the 2 events are in 2 issues ($issue_a, $issue_b)"; exit 1; }
          echo "ISSUE_ID=$issue_a" >> "$GITHUB_ENV"
          export GLITCHTIP_WEB_CONTAINER
          GLITCHTIP_WEB_CONTAINER="$($COMPOSE ps -q web)"
          scripts/glitchtip-delete-report.sh --check "$REPORT_ID"
          scripts/glitchtip-delete-report.sh --check "$KEEP_ID"

      - name: Make a reader user with a read-only token
        run: |
          set -euo pipefail
          out="$($COMPOSE exec -T -e GLITCHTIP_CI=true web ./manage.py shell -c "$(cat scripts/glitchtip-ci-reader.py)")"
          reader="$(sed -n 's/^READER //p' <<<"$out")"
          [[ "$reader" == "is_superuser=False is_staff=False usable_password=False role=member scopes=event:read,project:read" ]] ||
            { echo "the reader user is: $reader"; exit 1; }
          token="$(sed -n 's/^CI_READ_TOKEN=//p' <<<"$out")"
          [[ -n "$token" ]] || { echo "no read token"; exit 1; }
          echo "::add-mask::$token"
          echo "CI_READ_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Send 4 more problems, 1 for each row of the reader
        run: |
          set -euo pipefail
          # 1 allowlisted unit, 1 ChairLift code at its tag, 1 ChairLift code of
          # an app version with no tag (another code, or it would join the
          # issue of the first), and 1 update failure of the network.
          for name in unit_failed app_problem app_problem_untagged update_stage_failed; do
            id="$(node -e 'process.stdout.write(crypto.randomUUID())')"
            node scripts/glitchtip-send-event.mjs "$id" "test/fixtures/triage/ci/$name.json"
            case "$name" in
              unit_failed) echo "READER_UNIT_ID=$id" >> "$GITHUB_ENV" ;;
              app_problem) echo "READER_APP_ID=$id" >> "$GITHUB_ENV" ;;
              app_problem_untagged) echo "READER_UNTAGGED_ID=$id" >> "$GITHUB_ENV" ;;
              update_stage_failed) echo "READER_STAGE_ID=$id" >> "$GITHUB_ENV" ;;
            esac
          done

      - name: Wait until the issue list holds 5 issues
        run: |
          set -euo pipefail
          count() {
            node -e '
              let text = "";
              process.stdin.on("data", (chunk) => { text += chunk; });
              process.stdin.on("end", () => {
                try {
                  const rows = JSON.parse(text);
                  process.stdout.write(String(Array.isArray(rows) ? rows.length : 0));
                } catch {
                  process.stdout.write("0");
                }
              });
            '
          }
          for _ in $(seq 1 60); do
            body="$(curl -fsS -H "Authorization: Bearer $CI_TOKEN" "http://127.0.0.1:8000/api/0/organizations/frostyard/issues/" || true)"
            issues="$(printf '%s' "$body" | count)"
            [[ "$issues" == 5 ]] && { echo "the issue list holds 5 issues"; exit 0; }
            sleep 5
          done
          $COMPOSE logs --tail 100 web
          echo "the issue list holds $issues issues, want 5"
          exit 1

      - name: Run the reader against the test GlitchTip
        run: |
          set -euo pipefail
          src="$(mktemp -d)"
          node test/fixtures/triage/build-sources.mjs "$src"
          state="$(mktemp -d)"
          # The token file and its creation day live in 1 folder of their own,
          # mode 0600, exactly as on the team VM.
          home="$(mktemp -d)"
          printf '%s\n' "$CI_READ_TOKEN" > "$home/glitchtip-read.token"
          chmod 600 "$home/glitchtip-read.token"
          printf '%s\n' "$(date -u +%F)" > "$home/glitchtip-read.created"
          # The committed cutoff stays null; this run reads today's issues.
          printf '%s\n' '{"first_seen_cutoff": "2026-01-01T00:00:00Z"}' > triage/config.json
          TRIAGE_TEST=1 \
          TRIAGE_GLITCHTIP_URL=http://localhost:8000/api/0/ \
          TRIAGE_TOKEN_FILE="$home/glitchtip-read.token" \
          TRIAGE_STATE_DIR="$state" \
          TRIAGE_SOURCES="$src" \
            node scripts/triage/read.mjs
          echo "TRIAGE_STATE_DIR=$state" >> "$GITHUB_ENV"

      - name: Check the facts of the reader
        run: |
          set -euo pipefail
          CI_REPORT_IDS="$REPORT_ID $KEEP_ID $READER_UNIT_ID $READER_APP_ID $READER_UNTAGGED_ID $READER_STAGE_ID" \
            node test/fixtures/triage/ci/check-facts.mjs "$TRIAGE_STATE_DIR/facts.json"

      - name: Prove that the read token cannot change an issue
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $CI_READ_TOKEN" -H "Content-Type: application/json" \
            -d '{"status":"resolved"}' "http://127.0.0.1:8000/api/0/issues/$ISSUE_ID/")"
          [[ "$status" == 403 ]] || { echo "a PUT with the read token answers $status, want 403"; exit 1; }

      - name: Delete 1 report with the runbook script
        run: GLITCHTIP_WEB_CONTAINER="$($COMPOSE ps -q web)" scripts/glitchtip-delete-report.sh "$REPORT_ID"

      - name: Prove that it is gone and that the other report stays
        run: |
          set -euo pipefail
          export GLITCHTIP_WEB_CONTAINER
          GLITCHTIP_WEB_CONTAINER="$($COMPOSE ps -q web)"
          status_of() {
            curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CI_TOKEN" \
              "http://127.0.0.1:8000/api/0/projects/frostyard/system/events/${1//-/}/"
          }
          status="$(status_of "$REPORT_ID")"
          [[ "$status" == 404 ]] || { echo "deleted event answers $status, want 404"; exit 1; }
          rc=0
          scripts/glitchtip-delete-report.sh --check "$REPORT_ID" || rc=$?
          [[ "$rc" == 3 ]] || { echo "the check still finds the deleted report (exit $rc)"; exit 1; }
          status="$(status_of "$KEEP_ID")"
          [[ "$status" == 200 ]] || { echo "kept event answers $status, want 200"; exit 1; }
          scripts/glitchtip-delete-report.sh --check "$KEEP_ID"
          status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CI_TOKEN" \
            "http://127.0.0.1:8000/api/0/issues/$ISSUE_ID/")"
          [[ "$status" == 200 ]] || { echo "the issue answers $status, want 200"; exit 1; }
          echo "the deleted report is gone; the other report and the issue stay"

      - name: Prove that no table holds the deleted report_id
        run: |
          set -euo pipefail
          # The dump never reaches the log: only counts do.
          dump="$(mktemp)"
          $COMPOSE exec -T postgres pg_dump -U postgres --data-only postgres > "$dump"
          count() { { grep -o -F -- "$1" "$dump" || true; } | wc -l; }
          deleted_hyphen="$(count "$REPORT_ID")"
          deleted_hex="$(count "${REPORT_ID//-/}")"
          keep_hyphen="$(count "$KEEP_ID")"
          keep_hex="$(count "${KEEP_ID//-/}")"
          rm -f "$dump"
          echo "pg_dump matches: deleted report_id hyphen=$deleted_hyphen hex=$deleted_hex; kept report_id hyphen=$keep_hyphen hex=$keep_hex"
          [[ "$deleted_hyphen" == 0 && "$deleted_hex" == 0 ]] || { echo "a table still holds the deleted report_id"; exit 1; }
          (( keep_hyphen + keep_hex >= 1 )) || { echo "the dump holds no kept report_id: the check cannot fail"; exit 1; }

      - name: Prove that the cleanup check fails when no cleanup runs
        run: |
          set -euo pipefail
          rc=0
          GLITCHTIP_WEB_CONTAINER="$($COMPOSE ps -q web)" scripts/glitchtip-cleanup-proof.sh --no-maintenance || rc=$?
          [[ "$rc" == 3 ]] || { echo "with no cleanup the proof exits $rc, want 3"; exit 1; }

      - name: Make tag rows that the cleanup proof does not own
        run: |
          set -euo pipefail
          run="$(openssl rand -hex 4)"
          echo "OWN_RUN=$run" >> "$GITHUB_ENV"
          $COMPOSE exec -T -e GLITCHTIP_CI=true -e RUN="$run" -e ACTION=create -e ISSUE_ID="$ISSUE_ID" web \
            ./manage.py shell < scripts/glitchtip-ci-ownership.py | grep '^OWNERSHIP '

      - name: Prove that the nightly cleanup removes data older than the retention
        run: |
          set -euo pipefail
          out="$(mktemp)"
          # The run id of the rows above: the proof uses the same tag key and
          # values, and must keep them because it did not create them.
          GLITCHTIP_WEB_CONTAINER="$($COMPOSE ps -q web)" CLEANUP_PROOF_RUN="$OWN_RUN" \
            scripts/glitchtip-cleanup-proof.sh | tee "$out"
          grep -q '^COUNT: retention_days=72 ' "$out" || { echo "the running GlitchTip does not keep 72 days"; exit 1; }
          grep -Eq '^COUNT: stage=left( [a-z_]+=0)+$' "$out" || { echo "the stage=left counts are not all 0"; exit 1; }

      - name: Prove that the cleanup proof kept the tag rows it did not own
        run: |
          set -euo pipefail
          ownership() {
            $COMPOSE exec -T -e GLITCHTIP_CI=true -e RUN="$OWN_RUN" -e ACTION="$1" -e ISSUE_ID="$ISSUE_ID" web \
              ./manage.py shell < scripts/glitchtip-ci-ownership.py | grep '^OWNERSHIP '
          }
          counts="$(ownership count)"
          echo "after the proof: $counts"
          # The old cleanup deleted the unreferenced key and value of its run.
          [[ "$counts" == "OWNERSHIP key=1 old_value=1 new_value=1 tag_row=1" ]] ||
            { echo "the cleanup proof deleted tag rows that it did not create"; exit 1; }
          counts="$(ownership remove)"
          echo "after the removal: $counts"
          [[ "$counts" == "OWNERSHIP key=0 old_value=0 new_value=0 tag_row=0" ]] || { echo "the removal left rows"; exit 1; }

      - name: Stop the stack
        if: always()
        run: |
          $COMPOSE down -v --remove-orphans || true
          if [[ -n "${CI_DATA:-}" ]]; then sudo rm -rf "$CI_DATA"; fi
