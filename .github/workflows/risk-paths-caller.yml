# Risk paths caller (core ADR-0068, docs/specs/risk-paths.md): runs core's
# reusable risk-paths workflow on every pull request to add the label
# risk:high when a path in .github/risk-paths.json changes.
#
# Under pull_request_target the job runs trusted code only: core's workflow at
# a pinned 40-character commit (ADR-0021). It checks out nothing from the PR.
# No merge_group trigger, and not a required check. The label risk:high must
# exist in the repository, or the job fails.
name: Risk paths caller

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  risk-paths:
    permissions:
      contents: read
      pull-requests: write
    uses: frostyard/core/.github/workflows/risk-paths.yml@408ec56ab05c9d40d9ea5308670e593955b34c6f # frostyard/core main, 2026-11-05 (core has no release tags)
