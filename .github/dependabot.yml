# Dependabot (frostyard/core ADR-0071 row B13). This repository has 2 manifests
# that need updates: the actions the workflows pin (ADR-0021) and the npm
# dependencies of the Worker and its gate.
#
# Each entry has 1 group with `patterns: ["*"]`, so each entry opens at most 1
# version-update pull request for each run (ADR-0075). The group has no
# `applies-to`, so security updates stay 1 pull request each.
#
# `glitchtip/compose.yaml` pins its images by tag and digest. A GlitchTip update
# follows `docs/runbook/glitchtip.md`, so there is no `docker-compose` entry.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm:
        patterns: ["*"]
