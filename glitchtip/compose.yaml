# GlitchTip for frostyard problem reports: a TrueNAS SCALE custom app
# (docs/runbook/glitchtip.md, plan T857 section 5 "GlitchTip").
#
# 4 services: postgres, valkey, a one-shot migrate, and 1 web process that
# serves HTTP and runs the task worker and the scheduler. This file works on
# GlitchTip 6.2.6 and on GlitchTip 7.0 with no change but the image lines
# (ADR-0007).
#
# Pinned by test/node/compose.test.mjs: 72-day event, transaction, file, log
# and uptime life; sign-up and organization creation off; only web is
# published, on 10.0.1.100; every image pinned by tag and digest; a
# healthcheck on web, postgres and valkey; mem_limit on every service; no
# secret value and no variable reference.
#
# Secrets and host names come from 1 env file on the NAS,
# /mnt/fast/glitchtip/secrets/glitchtip.env (root, 0600; the names are in
# glitchtip/.env.example). Brian writes it before the install (the runbook
# says how), so this file is pasted into TrueNAS as it is, and an update diff
# shows only image lines. A key in "environment" wins over the env file:
# never add one of the env file's names here.
# Images: tag plus the multi-arch index digest from Docker Hub (checked with
# the Docker Hub API and skopeo inspect on 2026-11-05).

name: glitchtip

x-env-file: &env_file
  - /mnt/fast/glitchtip/secrets/glitchtip.env

x-environment: &environment
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: postgres
  DATABASE_USER: postgres
  VALKEY_URL: redis://valkey:6379/0
  # Retention: 72 days. Daily event partitions add up to 2 days, weekly tag
  # and aggregate partitions and the issue cleanup up to 9 days; with 7 days
  # of snapshots the worst case is about 88 days, under the 90 days of the
  # privacy page (docs/runbook/glitchtip.md, "Retention").
  # These are the names that GlitchTip 6 and 7 read. GlitchTip 7.0 ignores the
  # old GLITCHTIP_MAX_*_LIFE_DAYS names with a startup warning, and an ignored
  # name would leave its value at the default:
  # https://gitlab.com/glitchtip/glitchtip-backend/-/releases/v7.0.0
  GLITCHTIP_RETENTION_DAYS: "72"
  GLITCHTIP_EVENT_RETENTION_DAYS: "72"
  GLITCHTIP_TRANSACTION_RETENTION_DAYS: "72"
  GLITCHTIP_FILE_RETENTION_DAYS: "72"
  GLITCHTIP_LOG_RETENTION_DAYS: "72"
  GLITCHTIP_UPTIME_RETENTION_DAYS: "72"
  # No open sign-up: only the superuser adds users and organizations.
  ENABLE_USER_REGISTRATION: "false"
  ENABLE_SOCIAL_APPS_USER_REGISTRATION: "false"
  ENABLE_ORGANIZATION_CREATION: "false"
  # Features this store does not use.
  GLITCHTIP_ENABLE_UPTIME: "false"
  GLITCHTIP_ENABLE_LOGS: "false"
  GLITCHTIP_ENABLE_MCP: "false"
  VTASKS_CONCURRENCY: "2"
  # 1 process hosts HTTP, 1 task worker and the scheduler.
  GRANIAN_WORKERS: "1"

x-depends-on: &depends_on
  postgres:
    condition: service_healthy
  valkey:
    condition: service_healthy

services:
  postgres:
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    restart: unless-stopped
    command: ["postgres", "-c", "max_locks_per_transaction=512"]
    # POSTGRES_PASSWORD comes from the env file.
    env_file: *env_file
    volumes:
      - /mnt/fast/glitchtip/postgres:/var/lib/postgresql
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    restart: unless-stopped
    # A cache and task queue only: no volume, no persistence.
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: glitchtip/glitchtip:7.0.0@sha256:c245745b4179667da3aebd73fb8d4f1fd918f7d68ba07d1fd73ea688933b6e01
    command: ["./bin/run-migrate.sh"]
    restart: "no"
    env_file: *env_file
    environment: *environment
    depends_on: *depends_on
    mem_limit: 512m

  web:
    image: glitchtip/glitchtip:7.0.0@sha256:c245745b4179667da3aebd73fb8d4f1fd918f7d68ba07d1fd73ea688933b6e01
    restart: unless-stopped
    env_file: *env_file
    environment:
      <<: *environment
      # all_in_one runs the task worker and the scheduler in this process on
      # 6.2.6, and it is what 7.0 does anyway: 7.0 refuses any other role but
      # web, and warns on web. SKIP_INIT: migrate runs the migrations first.
      # https://gitlab.com/glitchtip/glitchtip-backend/-/releases/v7.0.0
      SERVER_ROLE: all_in_one
      SKIP_INIT: "true"
    depends_on:
      <<: *depends_on
      migrate:
        condition: service_completed_successfully
    ports:
      # The LAN address only, never all addresses. caddy (10.0.1.234) is the only client.
      - "10.0.1.100:30053:8000"
    volumes:
      - /mnt/fast/glitchtip/uploads:/code/uploads
    # The old web and worker limits added up. This process holds the task
    # worker and the scheduler too.
    mem_limit: 1536m
    healthcheck:
      # 1 shell string: some engines split the words of a CMD array item.
      test:
        - CMD-SHELL
        - >-
          python -c 'import sys, urllib.request;
          sys.exit(0 if urllib.request.urlopen("http://localhost:8000/_health/", timeout=5).status == 200 else 1)'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
